
<div class="modal-content" width="100%" >

  <div class="modal-header">
    <h1 class="modal-title pl-1 text-center" >Modifier vos informations</h1>
  </div>

  <div class="modal-body">

    <div>
      <form [formGroup]="profileFormValue">

        <div class='parent-cell'>

          <div class="form-group child-cell">
            <label for="userFirstName" class="text-primary font-weight-bold">Prénom</label>
            <input type="text" pattern="^[A-Za-zéèçïîô ]*[A-Za-zéèçïîô ][A-Za-zéèçïîô ]*$" formControlName="userFirstName" class="form-control border border-primary pl-2 round" id="userFirstName" name="userFirstName" placeholder="saisir votre prénom" >
<!--            <h5 class="text-danger text-bold ml-1 mt-1" >Merci de saisir un prénom valide</h5>-->
          </div>
          <span class="margin-center"  ></span>
          <div class="form-group child-cell">
            <label for="userLastName" class="text-primary font-weight-bold">Nom</label>
            <input type="text" pattern="^[A-Za-zéèçïîô ]*[A-Za-zéèçïîô ][A-Za-zéèçïîô ]*$" formControlName="userLastName" class="form-control border border-primary pl-2 round" id="userLastName" name="userLastName" placeholder="saisir votre nom" >
<!--            <h5 class="text-danger text-bold ml-1 mt-1" >Merci de saisir un nom valide</h5>-->
          </div>
          <span class="margin-center"  ></span>
          <div class="form-group child-cell">
            <label for="userGender" class="text-primary font-weight-bold">Sexe</label>
            <select formControlName="userGender" class="form-control border border-primary pl-2 round" id="userGender" >
              <option >Choisir votre sexe</option>
              <option >Homme</option>
              <option >Femme</option>
            </select>
            <!--            <h5 class="text-danger text-bold ml-1 mt-1" >Merci de saisir un nom valide</h5>-->
          </div>
        </div>

        <div class="form-group parent">
          <label for="userDescriptionInput" class="text-primary font-weight-bold">(Bio)</label>
          <textarea type="text" class="form-control border border-primary pl-2 round" id="userDescriptionInput" placeholder="Décrivez-vous..." formControlName="userDescription" ></textarea>
<!--            <h5 class="text-danger text-bold ml-2" >Merci de saisir une description</h5>-->
        </div>


        <div class='parent-cell'>
          <div class="form-group child">
            <label for="userBirthDateInput" class="text-primary font-weight-bold" >Date de naissance</label>
            <input type="date"  class="form-control border border-primary pl-2 round"  id="userBirthDateInput" formControlName="userBirthDate"/>
<!--            <h5 class="text-danger text-bold ml-2" >Merci de saisir un prénom valide</h5>-->
          </div>
          <span class="margin-center"></span>
          <div class="form-group child">
            <label for="userPhoneNumberInput" class="text-primary font-weight-bold">Numéro de téléphone</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userPhoneNumberInput" placeholder="saisir votre numéro de téléphone" formControlName="userPhoneNumber" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre date de naissance</h5>-->
          </div>
        </div>


        <div class='parent-cell'>
          <div class="form-group child">
            <label for="userCountryInput" class="text-primary font-weight-bold" >Pays</label>
            <input type="text"  class="form-control border border-primary pl-2 round"  id="userCountryInput" placeholder="saisir votre pays" formControlName="userCountry"/>
<!--            <h5 class="text-danger text-bold ml-2" >Merci de saisir un pays valide</h5>-->
          </div>
          <span class="margin-center"></span>
          <div class="form-group child">
            <label for="userStateInput" class="text-primary font-weight-bold">État</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userStateInput" placeholder="Saisir votre état" formControlName="userState" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre état</h5>-->
          </div>
        </div>


        <div class='parent-cell'>
          <div class="form-group child">
            <label for="userCityInput" class="text-primary font-weight-bold">Ville</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userCityInput" placeholder="saisir votre ville" formControlName="userCity" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre ville</h5>-->
          </div>
          <span class="margin-center"></span>
          <div class="form-group child">
            <label for="userZipCodeInput" class="text-primary font-weight-bold">Code postal</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userZipCodeInput" placeholder="saisir votre code postal" formControlName="userZipCode" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre code postal</h5>-->
          </div>
        </div>

        <div class='parent-cell'>
          <div class="form-group child">
            <label for="userHeightInput" class="text-primary font-weight-bold">Taille</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userHeightInput" placeholder="saisir votre taille en cm" formControlName="userHeight" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre ville</h5>-->
          </div>
          <span class="margin-center"></span>
          <div class="form-group child">
            <label for="userWeightInput" class="text-primary font-weight-bold">Poids</label>
            <input type="text" class="form-control border border-primary pl-2 round" id="userWeightInput" placeholder="saisir votre poids en kg" formControlName="userWeight" />
<!--            <h5 class="text-danger text-bold ml-2" >Merci de sélectionner votre ville</h5>-->
          </div>
        </div>

        <div class="row">
          <div class="col text-center">
            <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
            <button type="button" id="updateButton" class="btn btn-primary mr-3" (click)="updateProfile()">Éditer</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
