
<mat-form-field>
  <mat-label>Options</mat-label>
  <mat-select [formControl]="optionsList" multiple (selectionChange)="getSpecialitiesFromSelectList()">

    <mat-option *ngFor=" let activity of activities"  [value]="activity.actId">{{activity.actName}}</mat-option>

  </mat-select>
</mat-form-field>

<button type="button" class="btn btn-primary mr-3" (click)="addSpecialities()">Ajouter</button>
