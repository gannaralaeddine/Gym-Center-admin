<div class="row">
    <div class="col-12">
      <div class="card my-4">

        <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
          <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
            <div class="d-flex ml-6">
              <div class="ml-5"><h3 class="text-white text-capitalize pl-4 pt-2 add-category-position"><b>gestion des activités</b></h3></div>
              <div class="ml-auto transparent-color mr-4 pr-5 text-left"><button type="button" class="btn btn-dark mr-3 text-white add-category-position" (click)="addOrUpdateDialog(0)"><i class="material-icons text-sm me-2 text-white">add</i>AJOUTER</button></div>
            </div>
          </div>
        </div>

    </div>
  </div>
</div>

<mat-form-field [color]="'accent'">
  <mat-label>Chercher activité</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Saisir un nom d'activité pour chercher" #input>
</mat-form-field>

<div class="main-body">
  <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
  
        <!-- Image Column -->
        <ng-container matColumnDef="Image">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Image</th>
          <td mat-cell *matCellDef="let activity" class="text-center">
            <img [src]="getActivityImage(activity.actImage)" class="avatar avatar-sm me-3 border-radius-lg activity-image" alt="Session Image">
          </td>
        </ng-container>
    
        <!-- Title Column -->
        <ng-container matColumnDef="Titre">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Titre</th>
          <td mat-cell *matCellDef="let activity" class="text-center"> {{activity.actName}} </td>
        </ng-container>

        <!-- Description Column -->
        <ng-container matColumnDef="Description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Description</th>
          <td mat-cell *matCellDef="let activity" class="text-center"> {{activity.actDescription}} </td>
        </ng-container>
        
          <!-- Category Column -->
          <ng-container matColumnDef="Catégorie">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Catégorie</th>
            <td mat-cell *matCellDef="let activity" class="text-center"> {{activity.category.catName}} </td>
          </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="Gestion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Gestion</th>
          <td mat-cell *matCellDef="let activity" class="text-center"> 

            <button class="btn btn-link px-3 mb-0" href="javascript:" (click)="goToActivityDetails(activity)"><i class="material-icons text-sm me-2">assignment</i>Détails</button>
            <button class="btn btn-link text-dark px-3 mb-0" (click)="addOrUpdateDialog(activity.actId)"><i class="material-icons text-sm me-2">edit</i>Éditer</button>
            <button class="btn btn-link text-danger px-3 mb-0"><i class="material-icons text-sm me-2">delete</i>Supprimer</button>  

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4" *ngIf="!dataSource"></td>
          <td class="mat-cell" colspan="4" *ngIf="dataSource">Il n'y a pas d'activité avec le nom "{{input.value}}"</td>
        </tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
