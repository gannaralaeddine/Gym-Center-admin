
<div class="modal-content" style="margin: 10px">

    <div class="modal-header">
  
      <h1 class="modal-title pl-1" *ngIf="isAddOperation" >Ajouter Activité</h1>
      <h1 class="modal-title pl-1" *ngIf="!isAddOperation" >Éditer Activité</h1>
  
      <button type="button" class="close" (click)="closeDialog()">
        <span aria-hidden="true">&times;</span>
      </button>
    </div>
  
    <div class="modal-body">
  
      <div>
        <form [formGroup]="activityFormValue" >
  
              <div class="form-group">
                <label for="activityNameInput" class="text-dark font-weight-bold" >Nom Activité</label>
                <input type="text" class="form-control border border-secondary pl-2 round" id="activityNameInput" placeholder="saisir nom activité" formControlName="activityName">
              </div>
  
              <div class="form-group">
                <label for="activityDescriptionInput" class="text-dark font-weight-bold">Description Activité</label>
                <textarea type="text" class="form-control border border-secondary pl-2 round" id="activityDescriptionInput" placeholder="saisir description activité" formControlName="activityDescription"></textarea>
              </div>
  
              <div class="form-group">
                  <label for="categoryImageInput" class="text-dark font-weight-bold">Image Activité</label>
                  <input type="file" class="form-control border border-secondary pl-2 round" id="categoryImageInput" formControlName="activityImage">
              </div>
              <div class="form-group"> 
                
                  <!--<button class="btn btn-dark btn-lg dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                    Sélectionner Catégorie
                  </button>-->
                    <label for="categoryImageInput" class="text-dark font-weight-bold">Sélectionner Catégorie</label>
                    <select class="form-control border border-dark pl-2 round" formControlName="activityCategory" (change)="getCategory()">
                      <option></option>
                      <option *ngFor="let category of categories" [value]="category.catId">{{category.catName}}</option>
                    </select>
                  
                </div>
              
           
              <div class="row">
                <div class="col text-center">
                  <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
                  <button type="button" class="btn btn-primary mr-3" (click)="addActivity()" *ngIf="isAddOperation">Ajouter</button>
                  <button type="button" class="btn btn-primary mr-3" (click)="updateActivity(activityId)" *ngIf="!isAddOperation">Éditer</button>
                </div>
              </div>
        </form>
      </div>
  
    </div>
  
  </div>
