
<div class="modal-content" style="margin: 10px">

    <div class="modal-header">

      <h1 class="modal-title pl-1" *ngIf="isAddOperation" >Ajouter Séance</h1>
      <h1 class="modal-title pl-1" *ngIf="!isAddOperation" >Éditer Séance</h1>

      <button type="button" class="close" (click)="closeDialog()">
        <span aria-hidden="true">&times;</span>
      </button>

    </div>

    <div class="modal-body">

      <div>
        <form [formGroup]="sessionFormValue">

              <div class="form-group">
                <label for="sessionNameInput" class="text-dark font-weight-bold" >Nom de la séance</label>
                <input type="text" pattern="^[A-Za-zéèçïîô _]*[A-Za-zéèçïîô][A-Za-zéèçïîô _]*$" class="form-control border border-secondary pl-2 round"  id="sessionNameInput" placeholder="saisir nom séance" formControlName="sessionName" (blur)="checkValidityForm()" (keyup)="checkValidityForm()">
                <h5 class="text-danger text-bold ml-2" *ngIf="sessionFormValue.controls['sessionName'].invalid && sessionFormValue.controls['sessionName'].touched">Merci de saisir un nom valide</h5>
              </div>

              <div class="form-group">
                <label for="sessionTotalPlacesInput" class="text-dark font-weight-bold" >Nombre des places</label>
                <input type="number" class="form-control border border-secondary pl-2 round"  pattern="^[0-9]*$" id="sessionTotalPlacesInput" placeholder="saisir nombre entre 1 et 20" formControlName="sessionTotalPlaces" min="2" max="20" (blur)="checkValidityForm()" (keyup)="checkValidityForm()">
                <h5 class="text-danger text-bold ml-2" *ngIf="sessionFormValue.controls['sessionTotalPlaces'].invalid && sessionFormValue.controls['sessionTotalPlaces'].touched">Merci de saisir un numéro entre 2 et 20</h5>
              </div>

              <div class="form-group">
                <label for="sessionStartDateInput" class="text-dark font-weight-bold" >Date planifification</label>
                <input type="date" class="form-control border border-secondary pl-2 round"  id="sessionStartDateInput" placeholder="saisir nom séance" formControlName="sessionStartDate" [min]="minDate" (blur)="checkValidityForm()" (change)="checkValidityForm()">
                <h5 class="text-danger text-bold ml-2" *ngIf="sessionFormValue.controls['sessionStartDate'].invalid && sessionFormValue.controls['sessionStartDate'].touched">Merci de saisir une date valide</h5>
              </div>

              <div class="form-group">
                <label for="sessionDescriptionInput" class="text-dark font-weight-bold">Description Session</label>
                <textarea type="text" class="form-control border border-secondary pl-2 round" id="sessionDescriptionInput" placeholder="saisir description séance" formControlName="sessionDescription" (blur)="checkValidityForm()" (keyup)="checkValidityForm()"></textarea>
                <h5 class="text-danger text-bold ml-2" *ngIf="this.sessionFormValue.controls['sessionDescription'].getRawValue().length > 255">Le nombre maximum des caractères c'est 255</h5>
                <h5 class="text-danger text-bold ml-2" *ngIf="this.sessionFormValue.controls['sessionDescription'].invalid && this.sessionFormValue.controls['sessionDescription'].touched">Merci de saisir une description</h5>
              </div>

              <div class="form-group">
                  <label for="sessionImageInput" class="text-dark font-weight-bold">Image de la séance</label>
                  <input type="file" class="form-control border border-secondary pl-2 round" id="sessionImageInput" formControlName="sessionImage" #selectFile (change)="onFileSelected($event);checkValidityForm()" (blur)="checkValidityForm()">
                  <h5 class="text-danger text-bold ml-2" *ngIf="!this.data.sessionId && sessionFormValue.controls['sessionImage'].invalid && sessionFormValue.controls['sessionImage'].touched">Merci de choisir une image</h5>
              </div>

              <div class="form-group">
                <label for="activitySelectList" class="text-dark font-weight-bold">Activité de la séance</label>
                <select class="form-control border border-dark pl-2 round" id="activitySelectList" formControlName="sessionActivity" (change)="getActivityById();checkValidityForm()" (blur)="checkValidityForm()">
                  <option *ngFor="let activity of activities" [value]="activity.actId">{{activity.actName}}</option>
                </select>
                <h5 class="text-danger text-bold ml-2" *ngIf="sessionFormValue.controls['sessionActivity'].invalid && sessionFormValue.controls['sessionActivity'].touched">Merci de choisir une activité</h5>
              </div>

              <div class="form-group">
                <label for="coachSelectList" class="text-dark font-weight-bold">Coach de la séance</label>
                <select class="form-control border border-dark pl-2 round" id="coachSelectList" formControlName="sessionCoach" (change)="getCoachById();checkValidityForm()" (blur)="checkValidityForm()">
                  <option *ngFor="let coach of coaches" [value]="coach.userId">{{coach.userFirstName + " " + coach.userLastName}}</option>
                </select>
                <h5 class="text-danger text-bold ml-2" *ngIf="sessionFormValue.controls['sessionCoach'].invalid && sessionFormValue.controls['sessionCoach'].touched">Merci de choisir un coach</h5>
              </div>

              <div class="row">
                <div class="col text-center">
                  <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
                  <button type="button" id="addButton" class="btn btn-primary mr-3" (click)="addSessionWithOneImage()" *ngIf="isAddOperation" id="addButton" disabled>Ajouter</button>
                  <button type="button" id="updateButton" class="btn btn-primary mr-3" (click)="updateSession()" *ngIf="!isAddOperation" id="updateButton">Éditer</button>
                </div>
              </div>

        </form>
      </div>
    </div>
</div>
