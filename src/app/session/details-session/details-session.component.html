
<div class="container-fluid px-2 px-md-4">
    <div class="page-header min-height-300 border-radius-xl mt-4" style="background-image: url('https://images.unsplash.com/photo-1531512073830-ba890ca4eba2?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80');">
      <span class="mask  bg-gradient-primary  opacity-6"></span>
    </div>
    <div class="card card-body mx-3 mx-md-4 mt-n6">
      <div class="row gx-4 mb-2">

        <img [src]="sessionImage" height="600" width="500" alt="Activity Image">



        <div class="col-lg-4 col-md-6 my-sm-auto ms-sm-auto me-sm-0 mx-auto mt-3">
          <div class="nav-wrapper position-relative end-0">
            <ul class="nav nav-pills nav-fill p-1" role="tablist">
              <li class="nav-item">
                <a class="nav-link mb-0 px-0 py-1 " data-bs-toggle="tab" href="javascript:" role="tab" aria-selected="false" (click)="updateDialog(sessionId)">
                  <i class="material-icons text-lg position-relative">edit</i>
                  <span class="ms-1">Modifier cette séance</span>
                </a>
              </li>
            </ul>
          </div>
        </div>

      </div>


      <div class="row">
        <div class="row">
          <div class="row">

            <div class="col-9">
              <div class="card card-plain h-100">
                <div class="card-header pb-0 p-3">
                  <div class="row">
                    <div class="col-md-8 d-flex align-items-center">
                      <h1 class="mb-0 ml-8"></h1>
                    </div>
                  </div>
                </div>
                <div class="card-body p-3 mr-2">
                  <h2 class="mb-0 ml-1">Séance: {{sessionName}}</h2>
                  <h4 class="text-sm ml-1 mb-xl-1">
                    Coach: {{sessionCoach.userFirstName + " " + sessionCoach.userLastName}}
                  </h4>
                  <hr class="horizontal gray-light my-4">
                </div>
              </div>
            </div>

            <div class="col-3 text-end">
              <div class="card card-plain h-100">
                <div class="card-header pb-0 p-3">
                  <div class="row">
                    <div class="col-md-8 d-flex align-items-center">
                      <h1 class="mb-0 ml-4 mt-3 text-center">{{sessionActivity.actName}}</h1>
                    </div>
                  </div>
                </div>
                <div class="card-body p-3 text-center">
                  <img [src]="sessionActivityImage"  alt="img-blur-shadow" height="150" width="250" class="text-center shadow border-radius-xl mb-2">
                  <p>
                    {{sessionActivity.actDescription}}
                  </p>
                </div>
              </div>
            </div>

          </div>




          <div class="col-12 mt-4">
            <div class="mb-5 ps-3">
              <h2 class="mb-1">Gallerie</h2>
              <p class="text-sm">Notre gallerie des séances</p>
            </div>


            <div class="row">

              <div class="col-xl-3 col-md-6 mb-xl-0 mb-4">
                <div class="card card-blog card-plain">
                  <div class="card-header p-0 mt-n4 mx-3">
                    <a class="d-block shadow-xl border-radius-xl">
                      <img src="https://images.unsplash.com/photo-1606744824163-985d376605aa?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80" alt="img-blur-shadow" class="img-fluid shadow border-radius-xl">
                    </a>
                  </div>

                </div>
              </div>


              <div class="col-xl-3 col-md-6 mb-xl-0 mb-4">

                    </a>

                    </a>

                    </a>
                  </div>

                </div>
              </div>
            </div>
          </div>
