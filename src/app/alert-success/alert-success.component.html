



<div class="text-center" style="padding: 10px">

  <h1 class="modal-title pl-1 text-success" style="font-weight: bolder;" *ngIf="operationStatus">{{ title }}</h1>
  <h1 class="modal-title pl-1 text-danger" style="font-weight: bolder;" *ngIf="!operationStatus">{{ title }}</h1>

  <svg xmlns="http://www.w3.org/2000/svg" height="70" width="70" viewBox="0 0 512 512" *ngIf="operationStatus"><path fill="#36bb1b" d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg>
  <svg xmlns="http://www.w3.org/2000/svg" height="70" width="70" viewBox="0 0 512 512" *ngIf="!operationStatus"><path fill="#e13d3d" d="M256 32c14.2 0 27.3 7.5 34.5 19.8l216 368c7.3 12.4 7.3 27.7 .2 40.1S486.3 480 472 480H40c-14.3 0-27.6-7.7-34.7-20.1s-7-27.8 .2-40.1l216-368C228.7 39.5 241.8 32 256 32zm0 128c-13.3 0-24 10.7-24 24V296c0 13.3 10.7 24 24 24s24-10.7 24-24V184c0-13.3-10.7-24-24-24zm32 224a32 32 0 1 0 -64 0 32 32 0 1 0 64 0z"/></svg>

  <p class="text-center text-success" style="font-size: 25px;" *ngIf="operationStatus">{{ message }}</p>
  <p class="text-center text-danger" style="font-size: 25px;" *ngIf="!operationStatus">{{ message }}</p>

  <button class="btn btn-primary text-center" (click)="closeDialog()" >Ok</button>

</div>
