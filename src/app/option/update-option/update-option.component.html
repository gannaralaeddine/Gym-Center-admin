<div class="modal-content" style="margin: 10px">

    <div class="modal-header">
      <h1 class="modal-title pl-1">Éditer Offre</h1>

      <button type="button" class="close" (click)="closeDialog()">
        <span aria-hidden="true">&times;</span>
      </button>

    </div>

    <div class="modal-body">

      <div>
        <form [formGroup]="optionFormValue">

              <div class="form-group">
                <label for="offerTitleInput" class="text-dark font-weight-bold">Titre Option</label>
                <input type="text" pattern="^[A-Za-zéèçïîô ]*[A-Za-zéèçïîô][A-Za-zéèçïîô ]*$" class="form-control border border-secondary pl-2 round"  id="optionTitleInput" placeholder="saisir nom option" formControlName="optionTitle" (blur)="checkValidityForm()" (keyup)="checkValidityForm()">
                <h5 class="text-danger text-bold ml-2" *ngIf="optionFormValue.controls['optionTitle'].invalid && optionFormValue.controls['optionTitle'].touched">Merci de saisir un nom valide</h5>
              </div>


              <div class="row">
                <div class="col text-center">
                  <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
                  <button type="button" id="updateButton" class="btn btn-primary mr-3" (click)="updateOffer()">Éditer</button>
                </div>
              </div>
        </form>
      </div>
    </div>
</div>
