<div class="row">
    <div class="col-12">
      <div class="card my-4">

        <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
          <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
            <div class="d-flex ml-6">
              <div class="ml-5"><h3 class="text-white text-capitalize pl-4 pt-2 add-category-position"><b>gestion des options</b></h3></div>
              <!-- <div class="ml-auto transparent-color mr-4 pr-5 text-left"><button type="button" class="btn btn-dark mr-3 text-white add-category-position" (click)="addOrUpdateDialog(undefined)"><i class="material-icons text-sm me-2 text-white">add</i>AJOUTER</button></div> -->
            </div>
          </div>
        </div>

    </div>
  </div>
</div>



        <mat-form-field [color]="'accent'">
            <mat-label>Saisir Titre option</mat-label>
            <input matInput id="optionSearch" (keyup)="applyFilter()" #input>
        </mat-form-field>
  




<div class="main-body">
  <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource">

        <!-- Title Column -->
        <ng-container matColumnDef="Titre">
          <th mat-header-cell *matHeaderCellDef  class="text-center">Titre</th>
          <td mat-cell *matCellDef="let option" class="text-center"> {{option.optionName}} </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="Gestion">
          <th mat-header-cell *matHeaderCellDef  class="text-center" style="margin-left: -5%;">Gestion</th>
          <td mat-cell *matCellDef="let offer" class="text-center">

            <button class="btn btn-link text-dark px-3 mb-0" (click)="addOrUpdateDialog(offer.offerId)"><i class="material-icons text-sm me-2">edit</i>Éditer</button>
            <button class="btn btn-link text-danger px-3 mb-0"><i class="material-icons text-sm me-2">delete</i>Supprimer</button>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center" colspan="2" *ngIf="dataSource.data.length === 0">Il n'y a pas encore des options</td>
          <td class="mat-cell text-center" *ngIf="dataSource.data.length > 0 && dataSource.filteredData.length ===  0 ">Il n'y a pas des options avec le nom: <strong style="font-size: medium; color: #F44335;">{{input.value}}</strong>, vous pouvez l'ajouter</td>
          <td *ngIf="dataSource.data.length > 0 && dataSource.filteredData.length ===  0 "><button class="btn btn-link text-danger px-3 mb-0" (click)="addOption()"><i class="material-icons text-sm me-2">add</i>Ajouter</button></td>
        </tr>
      </table>

      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
