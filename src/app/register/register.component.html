<main class="main-content  mt-0">
  <div class="page-header align-items-start min-vh-100" style="background-image: url('https://images.unsplash.com/photo-1497294815431-9365093b7331?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1950&q=80'); margin-left: 1%;">
    <span class="mask bg-gradient-dark opacity-6"></span>
    <div class="container my-auto">
      <div class="row">
        <div class="col-lg-4 col-md-8 col-12 mx-auto">
          <div class="card z-index-0 fadeIn3 fadeInBottom">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-primary shadow-primary border-radius-lg py-3 pe-1">
                <h4 class="text-white font-weight-bolder text-center mt-2 mb-0">Créer un compte</h4>
              </div>
            </div>
            <div class="card-body" [ngClass]="isLoading ? 'disableBlur' : 'enableBlur'">
              <app-loading-spinner *ngIf="isLoading"></app-loading-spinner>

              <form [formGroup]="userForm" [ngClass]="isLoading ? 'enableBlur': 'disableBlur'">

                <div class="form-group" browser-default custom-select>
                  <label for="userRoleSelect" class="text-primary font-weight-bold" >Type de compte</label>
                  <select class="form-control border border-primary pl-2 round select-picker" id="userRoleSelect" name="userRole" formControlName="userRole">
                    <option value="0" [selected]="true">Choisir le type de compte</option>
                    <option value="1">MEMBRE</option>
                    <option value="2">COACH</option>
                    <option value="3">ADMIN</option>
                  </select>
                  <h5 class="text-danger text-bold ml-1 mt-1" *ngIf="userForm.controls['userRole'].getRawValue() === '0'">Merci de choisir un type de compte</h5>
                </div>

                <div class="form-group">
                  <label for="userEmailInput" class="text-primary font-weight-bold" >Email</label>
                  <input type="text" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$" formControlName="userEmail" class="form-control border border-primary pl-2 round" id="userEmailInput" name="userEmail" placeholder="saisir votre adresse Email" >
                  <h5 class="text-danger text-bold ml-1 mt-1" *ngIf="userForm.controls['userEmail'].invalid && userForm.controls['userEmail'].touched">Merci de saisir un email valide</h5>
                </div>


                <div class="form-group">
                  <label for="userLastName" class="text-primary font-weight-bold">Nom</label>
                  <input type="text" pattern="^[A-Za-zéèçïîô ]*[A-Za-zéèçïîô ][A-Za-zéèçïîô ]*$" formControlName="userLastName" class="form-control border border-primary pl-2 round" id="userLastName" name="userLastName" placeholder="saisir votre nom" >
                  <h5 class="text-danger text-bold ml-1 mt-1" *ngIf="userForm.controls['userLastName'].invalid && userForm.controls['userLastName'].touched">Merci de saisir un nom valide</h5>
                </div>

                <div class="form-group">
                  <label for="userFirstName" class="text-primary font-weight-bold">Prénom</label>
                  <input type="text" pattern="^[A-Za-zéèçïîô ]*[A-Za-zéèçïîô ][A-Za-zéèçïîô ]*$" formControlName="userFirstName" class="form-control border border-primary pl-2 round" id="userFirstName" name="userFirstName" placeholder="saisir votre prénom" >
                  <h5 class="text-danger text-bold ml-1 mt-1" *ngIf="userForm.controls['userFirstName'].invalid && userForm.controls['userFirstName'].touched">Merci de saisir un prénom valide</h5>
                </div>

                <div class="form-group">
                  <label for="userPassword" class="text-primary font-weight-bold">Mot de passe</label>
                  <input type="{{ isPasswordVisible ? 'text' : 'password' }}" formControlName="userPassword" class="form-control border border-primary pl-2 round" id="userPassword" name="userPassword" placeholder="saisir votre mot de passe" >
                  <h5 class="text-danger text-bold ml-1 mt-1" *ngIf="userForm.controls['userPassword'].invalid && userForm.controls['userPassword'].touched">Merci de saisir un mot de passe</h5>
                </div>

                <div>
                  <input type="checkbox" id="showPassword" name="showPassword" (click)="togglePasswordVisibility()" class="accent-color-primary-color"/>
                  <label for="showPassword">Afficher le mot de passe</label>
                </div>

                <div class="row">
                  <div class="col text-center">
                    <button type="submit" (click)="createUser()" [disabled]="userForm.controls['userRole'].getRawValue() === '0' || userForm.invalid" class="btn bg-gradient-primary w-100 my-4 mb-2" >Enregistrer</button>
                  </div>
                </div>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
