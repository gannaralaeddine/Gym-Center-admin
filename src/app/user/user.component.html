<div class="row">
  <div class="col-12">
    <div class="card my-4">
      <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
        <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
          <h3 class="text-white text-capitalize ps-3 "  style="font-weight: bold">Liste des utilisateurs</h3>
        </div>
      </div>
    </div>
  </div>
</div>

<mat-form-field [color]="'accent'">
  <mat-label>Chercher utilisateur</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Saisir un nom d'utilisateurpour chercher" #input>
</mat-form-field>

<div class="main-body">
  <div class="mat-elevation-z8">
      <table mat-table [dataSource]="dataSource" matSort>
  
        <!-- Image Column -->
        <ng-container matColumnDef="Image">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Image</th>
          <td mat-cell *matCellDef="let user" class="text-center">
            <img [src]="getUserImage(user.userPicture)" class="user-image avatar avatar-sm me-3 border-radius-lg" alt="user1" height="400" width="400">
          </td>
        </ng-container>

        <!-- Account Type Column -->
        <ng-container matColumnDef="Type de compte">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Type de compte</th>
          <td mat-cell *matCellDef="let user" class="text-center"> {{user.roles[0].roleName}} </td>
        </ng-container>
        
          <!-- E-mail Column -->
          <ng-container matColumnDef="E-mail">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Email</th>
            <td mat-cell *matCellDef="let user" class="text-center"> {{user.userEmail}} </td>
          </ng-container>

          <!-- Name Column -->
          <ng-container matColumnDef="Nom & Prénom">
            <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Nom & Prénom</th>
            <td mat-cell *matCellDef="let user" class="text-center"> {{ user.userFirstName }} {{ user.userLastName }} </td>
          </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="Gestion">
          <th mat-header-cell *matHeaderCellDef mat-sort-header class="text-center">Gestion</th>
          <td mat-cell *matCellDef="let activity" class="text-center"> 

            <a class="btn btn-link px-3 mb-0" href="javascript:"><i class="material-icons text-sm me-2">assignment</i>Détails</a>
            <a class="btn btn-link text-dark px-3 mb-0" href="javascript:" data-toggle="modal" data-target="#exampleModal"><i class="material-icons text-sm me-2">edit</i>Éditer</a>
            <a class="btn btn-link text-danger px-3 mb-0" href="javascript:" data-toggle="modal" data-target="#exampleModal"><i class="material-icons text-sm me-2">delete</i>Supprimer</a>

          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    
        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" colspan="4" *ngIf="!dataSource"></td>
          <td class="mat-cell" colspan="4" *ngIf="dataSource">Il n'y a pas d'utilisateur avec le nom "{{input.value}}"</td>
        </tr>
      </table>
    
      <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Select page of users"></mat-paginator>
  </div>
</div>
