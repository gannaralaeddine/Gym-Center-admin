<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<div class="modal-content" style="margin: 10px">

    <div class="modal-header">

      <h1 class="modal-title pl-1" >Ajouter des images</h1>

    </div>

    <div class="drop-zone" appDrag (files)="fileDropped($event)" > 

      <div  class="modal-body  text-wrapper" (click)="selectFile.click()">
        <span class="material-symbols-outlined">add_a_photo</span> Cliquer ou déposer vos images
      </div>
      
    </div>
    <input type="file" style="display: none" class="form-control border border-secondary" #selectFile id="formFile" (change)="onFileSelected($event)" multiple>
</div>


  <div class="row" >
    <mat-grid-list cols="4" rowHeight="1:1" >
      <mat-grid-tile *ngFor="let image of images; let i = index">
        <div style="position: relative" >
            <span class="btn-remove-image" (click)="removeImage(i)">x</span>
            <img [src]="image.url" height="100" width="150" alt="Activity image" />
        </div>
      </mat-grid-tile>
      
    </mat-grid-list>
  </div>

<div class="row mt-3">
  <div class="col text-center">
    <button type="button" class="btn btn-primary mr-3" (click)="addImages(activityId)" >Ajouter images</button>
  </div>
</div>
