
<div class="modal-content" style="margin: 10px">

  <div class="modal-header">

    <h1 class="modal-title pl-1" *ngIf="isAddOperation" >Ajouter Catégorie</h1>
    <h1 class="modal-title pl-1" *ngIf="!isAddOperation" >Éditer Catégorie</h1>

    <button type="button" class="close" >
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">

    <div>
      <form [formGroup]="categoryFormValue" >

            <div class="form-group">
              <label for="categoryNameInput" class="text-dark font-weight-bold" >Nom Catégorie</label>
              <input type="email" class="form-control border border-secondary pl-2 round" id="categoryNameInput" placeholder="saisir nom catégorie" formControlName="categoryName">
            </div>

            <div class="form-group">
              <label for="categoryDescriptionInput" class="text-dark font-weight-bold">Description Catégorie</label>
              <textarea type="text" class="form-control border border-secondary pl-2 round" id="categoryDescriptionInput" placeholder="saisir description catégorie" formControlName="categoryDescription"></textarea>
            </div>

          <div class="form-group">
            <label for="formFileMultiple" class="text-dark font-weight-bold">Image Catégorie</label>
            <input type="file" class="form-control border border-secondary" #selectFile id="formFileMultiple" (change)="onFileSelected($event)" multiple>
          </div>

            <div class="row">
              <div class="col text-center">
                <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
                <button type="button" class="btn btn-primary mr-3" (click)="addCategoryWithOneImage()" *ngIf="isAddOperation">ajouter</button>
                <button type="button" class="btn btn-primary mr-3" (click)="addImagesToCategory(categoryId)" *ngIf="!isAddOperation">add images</button>
                <button type="button" class="btn btn-primary mr-3" (click)="updateCategoryDetails(categoryId)" *ngIf="!isAddOperation">Éditer</button>
              </div>
            </div>
      </form>
    </div>

  </div>

</div>
