
<div class="modal-content" style="margin: 10px">

  <div class="modal-header">

    <h1 class="modal-title pl-1" *ngIf="isAddOperation" >Ajouter Catégorie</h1>
    <h1 class="modal-title pl-1" *ngIf="!isAddOperation" >Éditer Catégorie</h1>

    <button type="button" class="close" (click)="closeDialog()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>

  <div class="modal-body">

    <div>
      <form [formGroup]="categoryFormValue" >

            <div class="form-group">
              <label for="categoryNameInput" class="text-dark font-weight-bold" >Nom Catégorie</label>
              <input type="text" pattern="^[A-Za-zéèçïîô _]*[A-Za-zéèçïîô][A-Za-zéèçïîô _]*$" class="form-control border border-secondary pl-2 round" id="categoryNameInput" placeholder="saisir nom catégorie" formControlName="categoryName" (blur)="checkValidityForm()" (keyup)="checkValidityForm()">
              <h5 class="text-danger text-bold ml-2" *ngIf="categoryFormValue.controls['categoryName'].invalid && categoryFormValue.controls['categoryName'].touched">Merci de saisir un nom valide</h5>
            </div>

            <div class="form-group">
              <label for="categoryDescriptionInput" class="text-dark font-weight-bold">Description Catégorie</label>
              <textarea type="text" class="form-control border border-secondary pl-2 round" id="categoryDescriptionInput" placeholder="saisir description catégorie" formControlName="categoryDescription" (blur)="checkValidityForm()" (keyup)="checkValidityForm()"></textarea>
              <h5 class="text-danger text-bold ml-2" *ngIf="categoryFormValue.controls['categoryDescription'].invalid && categoryFormValue.controls['categoryDescription'].touched">Merci de saisir une description</h5>
            </div>

          <div class="form-group">
            <label for="formFile" class="text-dark font-weight-bold">Image Catégorie</label>
            <input type="file" class="form-control border border-secondary" #selectFile id="formFile" (blur)="onTouched()" (change)="onFileSelected($event)" formControlName="categoryImage" *ngIf="isAddOperation">
            <input type="file" class="form-control border border-secondary" #selectFile id="formMultipleFiles" (blur)="onTouched()" (close)="onTouched()" (change)="onFileSelected($event)" formControlName="categoryImage" *ngIf="!isAddOperation" multiple>
            <h5 class="text-danger text-bold ml-2" *ngIf="!categoryId && category.catImages.length < 1 && categoryFormValue.controls['categoryImage'].touched">Merci de sélectionner une image</h5>
          </div>

            <div class="row">
              <div class="col text-center">
                <button type="button" class="btn btn-dark mr-3" (click)="closeDialog()">annuler</button>
                <button type="button" id="addButton" class="btn btn-primary mr-3" (click)="addCategoryWithOneImage()" *ngIf="isAddOperation" disabled>ajouter</button>
                <button type="button" id="updateButton" class="btn btn-primary mr-3" (click)="updateCategoryDetails(categoryId)" *ngIf="!isAddOperation">Éditer</button>
              </div>
            </div>
      </form>
    </div>

  </div>

</div>
